name: Update repository catalog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - data/repos.json

permissions:
  contents: write

concurrency:
  group: repository-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate repository catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          org = "Let-s-Code-India"
          token = os.environ["GITHUB_TOKEN"]

          def get_json(url):
              request = Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "Let-s-Code-India-repository-catalog",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          repositories = []
          page = 1
          while True:
              batch = get_json(
                  f"https://api.github.com/orgs/{org}/repos"
                  f"?type=public&per_page=100&page={page}"
              )
              repositories.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          catalog = []
          for repo in repositories:
              pages_url = ""
              if repo.get("has_pages"):
                  fallback = f"https://let-s-code-india.github.io/{quote(repo['name'], safe='')}"
                  try:
                      pages = get_json(
                          f"https://api.github.com/repos/{org}/{quote(repo['name'], safe='')}/pages"
                      )
                      pages_url = pages.get("html_url") or fallback
                  except HTTPError:
                      pages_url = fallback

              catalog.append({
                  "name": repo["name"],
                  "description": repo.get("description"),
                  "language": repo.get("language"),
                  "html_url": repo["html_url"],
                  "homepage": repo.get("homepage"),
                  "has_pages": bool(repo.get("has_pages")),
                  "pages_url": pages_url,
                  "default_branch": repo.get("default_branch") or "main",
                  "pushed_at": repo.get("pushed_at"),
                  "topics": repo.get("topics", []),
                  "stargazers_count": repo.get("stargazers_count", 0),
                  "fork": bool(repo.get("fork")),
                  "archived": bool(repo.get("archived")),
              })

          destination = Path("data/repos.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Commit changed catalog
        run: |
          if [[ -z "$(git status --porcelain -- data/repos.json)" ]]; then
            echo "Repository catalog is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "chore: refresh repository catalog"
          git push